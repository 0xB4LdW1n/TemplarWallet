[package]
name = "templar-tui"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xB4LdW1n/TemplarWallet"
publish = false
edition = "2021"

[[bin]]
name = "templar"
path = "src/main.rs"

[dependencies]
templarlib = { path = "../templarlib" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rpassword = "7.4"
serde_json = "1.0"
zeroize = "1"
