[package]
name = "templarlib"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xB4LdW1n/TemplarWallet"
publish = false
edition = "2021"

[dependencies]
templar-core = { path = "../templar-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
fs2 = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
default = ["hardware"]
hardware = ["templar-core/hardware"]
